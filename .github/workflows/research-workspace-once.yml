name: Research workspace (one-time)
on:
  push:
    branches: [research/integrate-report-20260907]
    paths: [.github/workflows/research-workspace-once.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output=research-workspace.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-workspace
          path: research-workspace.tar.gz
          retention-days: 1
          if-no-files-found: error
