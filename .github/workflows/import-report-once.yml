name: Import report history (one-time)
on:
  push:
    branches: [research/integrate-report-20260907]
    paths: [.github/workflows/import-report-once.yml]
permissions:
  contents: write
concurrency:
  group: report-import-20260907
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'longnt27/CausClass' && github.ref == 'refs/heads/research/integrate-report-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: research/integrate-report-20260907
      - name: Import the pinned report snapshot and its history
        shell: bash
        run: |
          set -euo pipefail
          test ! -e report
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/longnt27/CausClass-report.git 947714f3d1eb517c19e697f394763b1f7e8e9944
          test "$(git rev-parse FETCH_HEAD)" = 947714f3d1eb517c19e697f394763b1f7e8e9944
          git merge --allow-unrelated-histories --strategy=ours --no-commit FETCH_HEAD
          git read-tree --prefix=report/ -u FETCH_HEAD
          git commit -m 'docs: integrate CausClass-report under report/ with original history' -m 'Source: longnt27/CausClass-report@947714f3d1eb517c19e697f394763b1f7e8e9944'
          git push origin HEAD:refs/heads/research/integrate-report-20260907
