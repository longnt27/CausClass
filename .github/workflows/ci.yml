name: Research CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      WANDB_MODE: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.8.22
      - run: uv sync --locked --extra dev --extra llm
      - run: make lint
      - run: uv run --no-sync pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - run: uv run --no-sync causclass-smoke --output-dir output/ci-smoke --seed 42
      - run: uv run --no-sync python -m build
      - name: Verify the installed wheel outside the source checkout
        shell: bash
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          temporary_home="$(mktemp -d)"
          cd "$temporary_home"
          CAUSCLASS_HOME="$temporary_home" "$GITHUB_WORKSPACE/.venv/bin/causclass-smoke" --output-dir "$temporary_home/wheel-smoke" --seed 42
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cpu-evidence-${{ matrix.python }}
          path: |
            test-results.xml
            coverage.xml
            output/ci-smoke/
            dist/
          retention-days: 14
  optional-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WANDB_MODE: disabled
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.8.22
      - run: uv sync --locked --extra dev --extra llm --extra vision --extra tracking --extra dashboard
      - run: uv run --no-sync pytest -m vision
      - run: uv run --no-sync python -m core.end_to_end_pipeline --help
      - run: uv run --no-sync python -m core.run_causal_discovery --help
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk biber texlive-latex-extra texlive-science texlive-lang-other texlive-fonts-recommended
      - run: make report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: thesis-report
          path: |
            report/build/main.pdf
            report/build/main.log
          retention-days: 30
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t causclass:ci .
      - run: docker run --rm --network none causclass:ci
