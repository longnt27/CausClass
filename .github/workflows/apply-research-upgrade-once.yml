name: Apply and validate research integration (one-time)
on:
  push:
    branches: [research/integrate-report-20260907]
    paths: [.github/workflows/apply-research-upgrade-once.yml]
permissions:
  contents: write
concurrency:
  group: research-upgrade-20260907
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'longnt27/CausClass' && github.ref == 'refs/heads/research/integrate-report-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WANDB_MODE: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/integrate-report-20260907
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Apply hash-verified, locally tested edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          payload = base64.b64decode(''.join(Path(f'.migration/part{i}.b64').read_text() for i in range(1, 7)), validate=True)
          assert hashlib.sha256(payload).hexdigest() == '1cb44c5e4b8436ff7cac82dbf8d34c71588ba404ec120114d1f21d403ae7f163'
          entries = json.loads(lzma.decompress(payload))
          prepared = []
          for entry in entries:
              path = Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              original = path.read_bytes() if path.exists() else None
              digest = hashlib.sha256(original).hexdigest() if original is not None else None
              assert digest == entry['sha256'], f'Original changed: {path}'
              if entry.get('delete'):
                  prepared.append((path, None))
                  continue
              lines = original.decode('utf-8').splitlines(keepends=True) if original is not None else []
              for start, stop, text in reversed(entry['edits']):
                  lines[start:stop] = text.splitlines(keepends=True)
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == entry['new_sha256'], f'New content mismatch: {path}'
              prepared.append((path, result))
          for path, contents in prepared:
              if contents is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(contents)
          print(f'Applied {len(prepared)} verified file changes.')
          # Keep both PyTorch and its vision extension on matching CPU wheels.
          path = Path('pyproject.toml')
          text = path.read_text().replace('vision = ["opencv-python', 'vision = ["torchvision>=0.21,<1", "opencv-python')
          text += "torchvision = [{ index = \"pytorch-cpu\", marker = \"sys_platform == 'linux' or sys_platform == 'win32'\" }]\n"
          path.write_text(text)
          PY
      - name: Resolve a reproducible CPU dependency environment
        run: |
          python -m pip install uv==0.8.22
          uv lock
          uv sync --locked --extra dev --extra llm
      - name: Format and validate the upgraded source
        run: |
          uv run --no-sync ruff format core/aerca_verifier.py core/smoke.py utils/reproducibility.py tests
          make lint
          uv run --no-sync pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
          uv run --no-sync causclass-smoke --output-dir output/bootstrap-smoke --seed 42
          uv run --no-sync python -m build
      - name: Commit validated code and remove one-time transport files
        run: |
          rm -rf .migration
          rm .github/workflows/apply-research-upgrade-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: consolidate research workflow with protocol-v2 fixes, tests, locked environment and reproducible report build'
          git push origin HEAD:refs/heads/research/integrate-report-20260907
          git archive --format=tar.gz --output=validated-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-evidence
          path: |
            test-results.xml
            coverage.xml
            output/bootstrap-smoke/
            dist/
            uv.lock
            validated-source.tar.gz
          retention-days: 7
