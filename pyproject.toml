[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "causclass"
version = "0.2.0"
description = "Research tools for temporal classroom behavior graph discovery"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Nguyen Trung Long"}]
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2", "torch>=2.6,<3", "tqdm>=4.67,<5",
  "requests>=2.32,<3", "tenacity>=8.2,<10", "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0,<3"]
vision = ["torchvision>=0.21,<1", "opencv-python>=4.9,<5", "ultralytics>=8.2,<9", "matplotlib>=3.8,<4"]
tracking = ["wandb>=0.17,<1"]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.24,<7"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff==0.12.12", "build>=1.2,<2"]

[project.scripts]
causclass-smoke = "core.smoke:main"

[project.urls]
Repository = "https://github.com/longnt27/CausClass"
Issues = "https://github.com/longnt27/CausClass/issues"

[tool.setuptools.packages.find]
include = ["core*", "utils*", "data*"]
exclude = ["tests*", "report*", "data.synth_data*", "data.cvat_dataset*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: deterministic local CPU integration tests", "vision: optional perception dependency tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["report", ".venv", "build"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["core.aerca_verifier", "core.smoke", "utils.reproducibility"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
